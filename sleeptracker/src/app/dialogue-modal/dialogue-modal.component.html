<ion-content [fullscreen]="true">

  <ion-grid>
    <ion-row>

      <ion-col size="6">
        <ion-item class="custom-item">
          <ion-label>Sleep Time:</ion-label>
        </ion-item>
        <ion-datetime (ionChange)="onSleepChange($event)" value="22:00:00" presentation="time"></ion-datetime>
      </ion-col>

      <ion-col size = "6">
        <ion-item class="custom-item">
          <ion-label>Wake Time:</ion-label>
        </ion-item>
        <ion-datetime (ionChange)="onWakeChange($event)" presentation="time"></ion-datetime>
      </ion-col>

    </ion-row>
  </ion-grid>


  <ion-grid>
    <ion-row class="ion-justify-content-center">

      <ion-col size="auto">
        <ion-button (click)="onCancel()">Cancel</ion-button>
      </ion-col>

      <ion-col size="auto">
        <ion-button (click)="onSaveOvernightSleep()">Save Log</ion-button>
      </ion-col>
      
    </ion-row>
  </ion-grid>

</ion-content>
