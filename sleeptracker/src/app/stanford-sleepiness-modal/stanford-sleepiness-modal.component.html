<ion-content [fullscreen]="true">

  <ion-item class="custom-item">
    <ion-label>How are you feeling?</ion-label>
  </ion-item>

  <ion-grid>
    <ion-row class="ion-justify-content-center">

      <ion-col size="10">
        <ion-range aria-label="Range with ticks" (ionChange)="onSleepinessChange($event)" [ticks]="true" [snaps]="true" [min]="1" [max]="7"></ion-range>
      </ion-col>

    </ion-row>
  </ion-grid>

  <div class="center-text">{{stanfordSleepinessScales[stanfordSleepinessValue]}}</div>

  <ion-item class="custom-item">
    <ion-label>Log Time:</ion-label>
  </ion-item>

  <ion-grid>
    <ion-row class="ion-justify-content-center">

      <ion-col size="6">
        <ion-datetime (ionChange)="onDateChange($event)" presentation="time"></ion-datetime>
      </ion-col>

    </ion-row>
  </ion-grid>

  <ion-grid>
    <ion-row class="ion-justify-content-center">

      <ion-col size="auto">
        <ion-button (click)="onCancel()">Cancel</ion-button>
      </ion-col>

      <ion-col size="auto">
        <ion-button (click)="onSaveSleepiness()">Save Log</ion-button>
      </ion-col>

    </ion-row>
  </ion-grid>
  
</ion-content>
