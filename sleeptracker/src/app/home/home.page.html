<ion-grid>
  <ion-row>

    <ion-col size="4">    
      <ion-picker>
        <ion-picker-column>
          @for (num of hourNumbers; track num) {
            <ion-picker-column-option value="{{num}}">{{num}}</ion-picker-column-option>
          }
        </ion-picker-column>
      </ion-picker>
    </ion-col>

    <ion-col size="6">
      <ion-picker>
        <ion-picker-column>
          @for (num of minuteNumbers; track num) {
            <ion-picker-column-option value="{{num}}">{{num}}</ion-picker-column-option>
          }
        </ion-picker-column>
      </ion-picker>
    </ion-col>

  </ion-row>
</ion-grid>
